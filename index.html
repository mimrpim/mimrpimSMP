<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Připojování k serveru...</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 { color: #ff4757; margin-bottom: 10px; }
        p { color: #aaa; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loader"></div>
        <h2>Načítám aktuální stav serveru...</h2>
    </div>

    <script>
        async function checkStatus() {
            const app = document.getElementById('app');
            // Timestamp ?t= zařídí 100% obcházení keše v prohlížeči i CDN
            const statusUrl = "https://raw.githubusercontent.com/mimrpim/mimrpimsmp/main/status.json?t=" + Date.now();
            
            try {
                const res = await fetch(statusUrl, { cache: "no-store" });
                if (!res.ok) throw new Error("Status unavailable");
                
                const data = await res.json();
                
                if (data.online && data.url) {
                    app.innerHTML = `
                        <div class="loader"></div>
                        <h2>Přesměrovávám na server...</h2>
                        <p>Pokud přesměrování nefunguje, <a href="${data.url}" style="color: #3498db;">klikni zde</a>.</p>
                    `;
                    window.location.replace(data.url);
                } else {
                    showOffline();
                }
            } catch (err) {
                showOffline();
            }
        }

        function showOffline() {
            document.getElementById('app').innerHTML = `
                <div class="card">
                    <h1>🔴 Server je offline</h1>
                    <p>Moje PC nebo služba momentálně neběží.</p>
                    <p><small>Zkus stránku obnovit později.</small></p>
                </div>
            `;
        }

        checkStatus();
    </script>
</body>
</html>
