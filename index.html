<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Server je offline</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 { color: #ff4757; margin-bottom: 10px; }
        p { color: #aaa; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔴 Server je offline</h1>
        <p>Moje PC nebo služba momentálně neběží.</p>
        <p><small>Zkus stránku obnovit později.</small></p>
    </div>
</body>
</html>
