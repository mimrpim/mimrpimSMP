<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <!-- Zákaz kešování v prohlížeči -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="refresh" content="0; url=offline.html">
    <script>window.location.href = "offline.html";</script>
    <title>Server je offline</title>
</head>
<body>
    <p>Server je vypnutý. Přesměrovávám na <a href="offline.html">offline.html</a>...</p>
</body>
</html>
