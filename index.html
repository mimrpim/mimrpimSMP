<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Připojování k serveru...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="status">
        <div class="loader"></div>
        <h2>Ověřuji stav serveru...</h2>
        <p>Za malý moment tě přesměrujeme.</p>
    </div>

    <script>
        // Doplňuje Python skript při startu PC
        const TARGET_URL = "https://tvuj-aktualni-tunel.trycloudflare.com"; 
        const TIMEOUT_MS = 3000; // Časový limit pro odpověď (3 sekundy)

        async function checkServer() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

            try {
                // Pokus o rychlé připojení k tunelu
                await fetch(TARGET_URL, {
                    method: 'HEAD',
                    mode: 'no-cors',
                    signal: controller.signal,
                    cache: 'no-cache'
                });
                
                clearTimeout(timeoutId);
                // Server odpovídá -> přesměrování
                window.location.href = TARGET_URL;

            } catch (error) {
                clearTimeout(timeoutId);
                // Server neodpovídá / PC je vypnuté
                
                // Varianta A: Přesměrování na samostatnou stranu offline.html
                window.location.href = "offline.html";

                /* 
                // Varianta B: Zobrazení hlášky přímo na této stránce
                document.getElementById('status').innerHTML = `
                    <h1 style="color: #ff4757;">Server je offline 🔴</h1>
                    <p>Počítač nebo Cloudflare tunel momentálně neběží.</p>
                    <p>Zkus to prosím později!</p>
                `;
                */
            }
        }

        checkServer();
    </script>
</body>
</html>
