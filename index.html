<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Připojování k serveru...</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 { color: #ff4757; margin-bottom: 10px; }
        p { color: #aaa; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="status">
        <div class="loader"></div>
        <h2>Ověřuji stav serveru...</h2>
        <p>Za malý moment tě přesměrujeme.</p>
    </div>

    <script>
        const TARGET_URL = "https://performed-likely-patrick-anything.trycloudflare.com";
        const TIMEOUT_MS = 3000;

        async function checkServer() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

            try {
                await fetch(TARGET_URL, {
                    method: 'HEAD',
                    mode: 'no-cors',
                    signal: controller.signal,
                    cache: 'no-cache'
                });
                clearTimeout(timeoutId);
                window.location.href = TARGET_URL;
            } catch (error) {
                clearTimeout(timeoutId);
                // Místo přesměrování přepíše obsah stránky na offline vzhled
                document.body.innerHTML = `
                    <div class="card">
                        <h1>🔴 Server je offline</h1>
                        <p>Moje PC nebo služba momentálně neběží.</p>
                        <p><small>Zkus stránku obnovit později.</small></p>
                    </div>
                `;
            }
        }

        checkServer();
    </script>
</body>
</html>
